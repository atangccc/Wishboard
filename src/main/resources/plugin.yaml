apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: PluginWishboard
spec:
  enabled: true
  requires: ">=2.23.0"
  version: "${pluginVersion}"
  author:
    name: Serenity
    website: https://www.aobp.cn
  logo: /static/logo.svg
  homepage: https://www.aobp.cn
  repo: https://github.com/atangccc/Wishboard
  displayName: "心愿便签"
  description: "心愿墙 + 树洞，支持情侣心愿追踪、访客匿名留言、AI 暖心回复与内容审核，提供独立页面和主题适配 API。"
  license:
    - name: "GPL-3.0"
      url: https://opensource.org/licenses/GPL-3.0
  configMapName: "plugin-wishboard-configmap"
