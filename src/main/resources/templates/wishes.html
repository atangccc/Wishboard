<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${pageTitle}">心愿墙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-line: transparent;
      --grid: 32px;
      --card-w: 230px;
      --card-r: 14px;
      --serif: 'Noto Serif SC','Georgia',serif;
      --sans: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --text: #2c2c2c;
      --text2: #666;
      --muted: #999;
      --shadow: 0 8px 28px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
      --shadow-hover: 0 14px 40px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.08);
      --shadow-drag: 0 22px 50px rgba(0,0,0,.25), 0 6px 16px rgba(0,0,0,.12);
    }
    *{margin:0;padding:0;box-sizing:border-box}

    body {
      font-family: var(--sans);
      color: var(--text);
      min-height: 100dvh;
      overflow: hidden;
      background: linear-gradient(160deg, #ffffff 0%, #fff8f9 40%, #fff5f6 70%, #ffffff 100%);
    }
    body.is-mobile {
      overflow-y: auto;
    }

    /* Board */
    #board {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }
    body.is-mobile #board {
      height: auto;
      min-height: 100dvh;
      padding-bottom: 140px;
    }

    /* Cards */
    .card {
      position: absolute;
      width: var(--card-w);
      border-radius: var(--card-r);
      box-shadow: var(--shadow);
      background: #fff;
      border: 1px solid rgba(0,0,0,.06);
      overflow: hidden;
      transform-origin: center;
      transition: transform .35s cubic-bezier(.25,.8,.25,1),
                  box-shadow .35s ease,
                  opacity .4s ease;
      cursor: default;
    }
    .card:hover {
      box-shadow: var(--shadow-hover);
      z-index: 9000 !important;
    }
    .card.dragging {
      transition: none;
      box-shadow: var(--shadow-drag);
      z-index: 10000 !important;
      cursor: grabbing;
    }

    /* Card header - macOS style */
    .card-header {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: rgba(255,255,255,.6);
      backdrop-filter: blur(6px);
      cursor: grab;
      user-select: none;
    }
    .card.dragging .card-header { cursor: grabbing; }

    .window-dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .dot {
      width: 11px; height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.08);
    }
    .dot.red   { background: #ff5f57; border-color: #e0443e; }
    .dot.yellow { background: #febb2e; border-color: #dea123; }
    .dot.green  { background: #28c840; border-color: #1aab2c; }

    .card-label {
      margin-left: auto;
      font-size: 11px;
      font-weight: 500;
      color: rgba(0,0,0,.35);
      letter-spacing: .03em;
    }

    /* Card body */
    .card-body {
      padding: 14px 16px 10px;
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.65;
      font-weight: 400;
      color: rgba(0,0,0,.72);
      word-break: break-word;
    }

    /* Card footer */
    .card-footer {
      padding: 0 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }
    .card-nick {
      font-weight: 500;
      color: var(--text2);
    }

    /* Card color variables for status tags */
    .card[data-color="green"]  { --tag-bg: rgba(76,175,80,0.18); --tag-color: #2e7d32; --tag-dot: #43a047; }
    .card[data-color="yellow"] { --tag-bg: rgba(255,193,7,0.22); --tag-color: #f57f17; --tag-dot: #f9a825; }
    .card[data-color="purple"] { --tag-bg: rgba(156,39,176,0.15); --tag-color: #7b1fa2; --tag-dot: #9c27b0; }
    .card[data-color="pink"]   { --tag-bg: rgba(233,30,99,0.15); --tag-color: #c2185b; --tag-dot: #e91e63; }
    .card[data-color="blue"]   { --tag-bg: rgba(33,150,243,0.18); --tag-color: #1565c0; --tag-dot: #1e88e5; }
    .card[data-color="orange"] { --tag-bg: rgba(255,152,0,0.20); --tag-color: #e65100; --tag-dot: #f57c00; }

    /* Status text (italic, inline after content) */
    .wish-status-text {
      font-style: italic;
      font-size: 13px;
      font-weight: 500;
      margin-left: 6px;
      color: var(--tag-color, #2e7d32);
      opacity: 0.78;
      white-space: nowrap;
      letter-spacing: .02em;
    }

    /* AI reply */
    .card-ai {
      margin: 6px 16px 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(0,0,0,.05);
      font-size: 12px;
      color: var(--text2);
      font-style: italic;
      line-height: 1.55;
    }
    .card-ai::before {
      content: 'AI ';
      font-style: normal;
      font-weight: 700;
      color: #c4856a;
      font-size: 10px;
      letter-spacing: .06em;
    }

    /* Done image */
    .card-done-img {
      width: calc(100% - 32px);
      margin: 6px 16px 0;
      border-radius: 8px;
      max-height: 140px;
      object-fit: cover;
    }
    .card-done-note {
      margin: 4px 16px 8px;
      font-size: 12px;
      color: var(--text2);
      font-style: italic;
    }

    /* Empty state */
    .empty-state {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      font-family: var(--serif);
      pointer-events: none;
    }
</style>
</head>
<body>
  <style>
    /* ===== Bottom input bar (glassmorphism) ===== */
    .input-bar {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 18px;
      background: rgba(255,255,255,.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.5);
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      z-index: 10001;
      transition: all .3s ease;
      max-width: 680px;
      width: calc(100% - 40px);
    }
    .input-bar:focus-within {
      background: rgba(255,255,255,.55);
      box-shadow: 0 6px 28px rgba(0,0,0,.12);
    }

    .input-bar input[type="text"] {
      flex: 1;
      font-size: 14px;
      padding: 10px 14px;
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 12px;
      outline: none;
      background: rgba(255,255,255,.5);
      color: var(--text);
      min-width: 0;
      font-family: var(--sans);
      transition: all .2s ease;
    }
    .input-bar input[type="text"]::placeholder { color: rgba(0,0,0,.35); }
    .input-bar input[type="text"]:focus {
      background: rgba(255,255,255,.7);
      border-color: rgba(0,0,0,.2);
    }

    .input-nick {
      width: 80px;
      flex-shrink: 0;
    }

    /* Color picker in input bar */
    .bar-colors {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .bar-color {
      width: 18px; height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all .2s;
      opacity: .65;
    }
    .bar-color:hover, .bar-color.active {
      opacity: 1;
      border-color: rgba(0,0,0,.25);
      transform: scale(1.15);
    }

    /* Type toggle */
    .bar-type {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,.08);
      background: rgba(255,255,255,.4);
      color: var(--text2);
      cursor: pointer;
      font-family: var(--sans);
      font-weight: 500;
      white-space: nowrap;
      transition: all .2s;
      flex-shrink: 0;
    }
    .bar-type:hover { background: rgba(255,255,255,.7); }

    .bar-btn {
      padding: 9px 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      font-family: var(--sans);
      color: #fff;
      background: rgba(214,114,122,.72);
      backdrop-filter: blur(6px);
      transition: all .25s ease;
      box-shadow: 0 2px 8px rgba(214,114,122,.2);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .bar-btn:hover {
      background: rgba(214,114,122,.9);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(214,114,122,.3);
    }
    .bar-btn:active { transform: translateY(0); }
    .bar-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .char-counter {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
      font-family: var(--sans);
      transition: color .2s;
    }
    .char-counter.over { color: #e53e3e; font-weight: 600; }

    .bar-btn.polish {
      background: rgba(180,152,208,.65);
      box-shadow: 0 2px 8px rgba(180,152,208,.2);
    }
    .bar-btn.polish:hover {
      background: rgba(180,152,208,.85);
      box-shadow: 0 4px 12px rgba(180,152,208,.3);
    }

    /* Top filter tabs */
    .top-tabs {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      padding: 5px 8px;
      border-radius: 14px;
      background: transparent;
      z-index: 10001;
    }
    .top-tab {
      padding: 6px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text2);
      background: transparent;
      border: none;
      font-family: var(--sans);
      transition: all .25s;
      letter-spacing: .02em;
    }
    .top-tab:hover { color: var(--text); background: rgba(255,255,255,.5); }
    .top-tab.active {
      color: #d4727a;
      background: rgba(245,150,170,.12);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(44,44,44,.88);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 8px 20px;
      border-radius: 12px;
      font-size: 13px;
      z-index: 20000;
      opacity: 0;
      transition: all .35s;
      pointer-events: none;
      font-family: var(--sans);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Days counter badge */
    .days-badge {
      position: fixed;
      top: 20px;
      right: 24px;
      padding: 6px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,.35);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.5);
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      font-family: var(--serif);
      font-size: 13px;
      color: var(--text2);
      z-index: 10001;
      display: none;
    }
    .days-badge .num {
      font-weight: 700;
      font-size: 18px;
      color: #c4856a;
      margin: 0 3px;
    }

    /* Title badge */
    .title-badge {
      position: fixed;
      top: 20px;
      left: 24px;
      z-index: 10001;
    }
    .title-badge h1 {
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: .04em;
    }
    .title-badge p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .card { --card-w: 180px; }
      .card-body { font-size: 13px; padding: 12px 14px 8px; }
      .input-bar { bottom: 16px; padding: 8px 12px; gap: 6px; flex-wrap: wrap; }
      .input-nick { width: 60px; }
      .bar-colors { order: 10; width: 100%; justify-content: center; padding-top: 4px; }
      .title-badge { display: none; }
      .days-badge { top: auto; bottom: 90px; right: 12px; font-size: 11px; }
      .days-badge .num { font-size: 15px; }
    }

    /* Animations */
    @keyframes cardIn {
      from { opacity: 0; transform: scale(.85) rotate(0deg); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>

  <!-- Title -->
  <div class="title-badge">
    <h1 th:text="${pageTitle}">心愿墙</h1>
    <p th:text="${pageSubtitle}">写下你的心愿，留下你的故事</p>
  </div>

  <!-- Days counter -->
  <div class="days-badge" id="daysBadge" th:if="${showDaysCounter}" th:attr="data-date=${anniversaryDate},data-name-a=${partnerNameA},data-name-b=${partnerNameB}">
    <span id="daysContent"></span>
  </div>

  <!-- Filter tabs (Finder API) -->
  <th:block th:with="types=${wishFinder.listTypes()}">
    <div class="top-tabs" id="topTabs">
      <button class="top-tab active" data-filter="all">全部</button>
      <button class="top-tab" th:each="type : ${types}"
              th:data-filter="${type.spec.slug}"
              th:text="${type.spec.displayName}">类型</button>
    </div>
  </th:block>

  <!-- Board (Finder API 服务端渲染便签卡片) -->
  <th:block th:with="wishes=${wishFinder.listApproved()}, typeMap=${wishFinder.getTypeMap()}">
    <div id="board">
      <div class="empty-state" id="emptyState" th:if="${#lists.isEmpty(wishes)}">还没有便签，来贴第一张吧</div>
      <div class="card" th:each="wish, iter : ${wishes}"
           th:data-type="${wish.spec.type}"
           th:data-color="${wish.spec.color ?: 'green'}">
        <div class="card-header">
          <div class="window-dots">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
          </div>
          <span class="card-label" th:text="${typeMap[wish.spec.type] ?: wish.spec.type}">类型</span>
        </div>
        <div class="card-body">
          <span th:text="${wish.spec.content}">内容</span>
          <em th:if="${wish.spec.status == 'doing'}" class="wish-status-text">进行中</em>
          <em th:if="${wish.spec.status == 'done'}" class="wish-status-text">已达成</em>
        </div>
        <div th:if="${wish.spec.doneNote}" class="card-done-note" th:text="${wish.spec.doneNote}"></div>
        <img th:if="${wish.spec.doneImage != null and wish.spec.status == 'done'}"
             class="card-done-img" th:src="${wish.spec.doneImage}" alt="" loading="lazy" />
        <div th:if="${wish.spec.aiReply}" class="card-ai" th:text="${wish.spec.aiReply}"></div>
        <div class="card-footer">
          <span class="card-nick" th:text="${wish.spec.anonymous ? '匿名' : (wish.spec.nickname ?: '匿名')}">昵称</span>
          <span th:text="${#temporals.format(wish.spec.createdAt, 'yyyy/M/d')}"></span>
        </div>
      </div>
    </div>
  </th:block>

  <!-- Input bar -->
  <div class="input-bar" th:if="${enableSubmit ?: true}">
    <input type="text" class="input-nick" id="inputNick" placeholder="昵称" maxlength="20" />
    <input type="text" id="inputContent" placeholder="写下你想说的话..."
           th:maxlength="${maxContentLength}" />
    <span class="char-counter" id="charCounter"></span>
    <div class="bar-colors" id="colorPicker">
      <span class="bar-color active" data-color="green"  style="background:#c8e6c9"></span>
      <span class="bar-color" data-color="yellow" style="background:#fff9c4"></span>
      <span class="bar-color" data-color="purple" style="background:#e1bee7"></span>
      <span class="bar-color" data-color="pink"   style="background:#ffcdd2"></span>
      <span class="bar-color" data-color="blue"   style="background:#bbdefb"></span>
      <span class="bar-color" data-color="orange" style="background:#ffe0b2"></span>
    </div>
    <button class="bar-type" id="typeToggle" title="切换类型">树洞</button>
    <button class="bar-btn polish" id="polishBtn" th:style="${aiEnabled ? '' : 'display:none'}">润色</button>
    <button class="bar-btn" id="submitBtn">发布</button>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script th:inline="javascript">
    /*<![CDATA[*/
    const API = '/apis/anonymous.wishboard.aobp.cn/v1alpha1';
    const CARD_COLORS = {
      green:  'rgb(217,242,217)',
      yellow: 'rgb(249,247,217)',
      purple: 'rgb(229,215,255)',
      pink:   'rgb(255,224,227)',
      blue:   'rgb(199,240,255)',
      orange: 'rgb(255,216,168)'
    };

    const allTypes = /*[[${wishFinder.listTypes()}]]*/ [];
    const maxContentLength = /*[[${maxContentLength}]]*/ 200;

    let currentFilter = 'all', selectedColor = 'green';
    let currentType = allTypes.length > 0 ? allTypes[0].spec.slug : 'treehole';
    let zCounter = 200;

    // Mobile detection
    const isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent)
      || window.innerWidth < 768;
    if (isMobile) document.body.classList.add('is-mobile');

    document.addEventListener('DOMContentLoaded', () => {
      initCards();
      initTabs();
      initColorPicker();
      initSubmit();
      initPolish();
      initTypeToggle();
      initCharCounter();
      initDaysCounter();
    });

    /* ===== 初始化服务端渲染的卡片（位置、颜色、拖拽） ===== */
    function initCards() {
      const board = document.getElementById('board');
      const cards = board.querySelectorAll('.card');
      const bw = window.innerWidth;
      const bh = window.innerHeight;
      const cw = isMobile ? 180 : 230;
      const margin = 20;

      cards.forEach((card, i) => {
        const rotation = (Math.random() * 6 - 3).toFixed(2);
        const color = card.dataset.color || 'green';
        const bg = CARD_COLORS[color] || CARD_COLORS.green;
        card.style.background = bg;

        let left, top;
        if (isMobile) {
          const cols = Math.floor(bw / (cw + margin));
          const col = i % Math.max(cols, 2);
          const row = Math.floor(i / Math.max(cols, 2));
          left = margin + col * (cw + margin) + (Math.random() * 10 - 5);
          top = 70 + row * 160 + (Math.random() * 20 - 10);
        } else {
          left = margin + Math.random() * (bw - cw - margin * 2);
          top = 70 + Math.random() * (bh - 190 - 100);
        }

        card.style.left = left + 'px';
        card.style.top = top + 'px';
        card.style.zIndex = zCounter++;
        card.style.transform = 'rotate(' + rotation + 'deg)';
        card.style.animation = 'cardIn .4s ease ' + (i * 50) + 'ms forwards';

        if (!isMobile) initDrag(card);
        card.addEventListener('mousedown', () => { card.style.zIndex = ++zCounter; });
      });
    }

    /* ===== Tabs (筛选服务端渲染的卡片) ===== */
    function initTabs() {
      document.querySelectorAll('.top-tab').forEach(t => {
        t.addEventListener('click', () => {
          document.querySelectorAll('.top-tab').forEach(x => x.classList.remove('active'));
          t.classList.add('active');
          currentFilter = t.dataset.filter;
          filterCards();
        });
      });
    }

    function filterCards() {
      const board = document.getElementById('board');
      const cards = board.querySelectorAll('.card');
      const empty = document.getElementById('emptyState');
      let visible = 0;
      cards.forEach(c => {
        const type = c.dataset.type;
        const show = currentFilter === 'all' || type === currentFilter;
        c.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      if (empty) empty.style.display = visible === 0 ? 'block' : 'none';
    }

    /* ===== Drag ===== */
    function initDrag(card) {
      const header = card.querySelector('.card-header');
      let startX, startY, origX, origY, dragging = false;

      header.addEventListener('mousedown', (e) => {
        e.preventDefault();
        dragging = true;
        card.classList.add('dragging');
        card.style.zIndex = ++zCounter;
        startX = e.clientX;
        startY = e.clientY;
        origX = card.offsetLeft;
        origY = card.offsetTop;

        const onMove = (ev) => {
          if (!dragging) return;
          card.style.left = (origX + ev.clientX - startX) + 'px';
          card.style.top  = (origY + ev.clientY - startY) + 'px';
        };
        const onUp = () => {
          dragging = false;
          card.classList.remove('dragging');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }

    function initColorPicker() {
      document.querySelectorAll('.bar-color').forEach(d => {
        d.addEventListener('click', () => {
          document.querySelectorAll('.bar-color').forEach(x => x.classList.remove('active'));
          d.classList.add('active');
          selectedColor = d.dataset.color;
        });
      });
    }

    /* ===== Type toggle ===== */
    function initTypeToggle() {
      const btn = document.getElementById('typeToggle');
      if (allTypes.length > 0) btn.textContent = allTypes[0].spec.displayName;
      btn.addEventListener('click', () => {
        if (allTypes.length === 0) return;
        const idx = allTypes.findIndex(t => t.spec.slug === currentType);
        const next = (idx + 1) % allTypes.length;
        currentType = allTypes[next].spec.slug;
        btn.textContent = allTypes[next].spec.displayName;
      });
    }

    /* ===== Submit ===== */
    function initSubmit() {
      document.getElementById('submitBtn').addEventListener('click', async () => {
        const content = document.getElementById('inputContent').value.trim();
        const nickname = document.getElementById('inputNick').value.trim() || '匿名';
        if (!content) { toast('写点什么吧'); return; }
        if (content.length > maxContentLength) { toast('内容超过' + maxContentLength + '字限制'); return; }
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.textContent = '发布中...';
        try {
          const r = await fetch(`${API}/wishes/-/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              content, nickname, color: selectedColor,
              type: currentType,
              anonymous: !nickname || nickname === '匿名'
            })
          });
          const d = await r.json();
          if (r.ok) {
            toast(d.message || '发布成功');
            document.getElementById('inputContent').value = '';
            updateCharCounter();
            if (d.status === 'approved') {
              setTimeout(() => location.reload(), 800);
            }
          } else {
            toast(d.error || '提交失败');
          }
        } catch(e) { toast('网络错误'); }
        finally { btn.disabled = false; btn.textContent = '发布'; }
      });

      // Enter key submit
      document.getElementById('inputContent').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          document.getElementById('submitBtn').click();
        }
      });
    }

    /* ===== AI Polish ===== */
    function initPolish() {
      document.getElementById('polishBtn').addEventListener('click', async () => {
        const input = document.getElementById('inputContent');
        const content = input.value.trim();
        if (!content) { toast('先写点内容再润色'); return; }
        const btn = document.getElementById('polishBtn');
        btn.disabled = true; btn.textContent = '润色中...';
        try {
          const r = await fetch(`${API}/wishes/-/polish`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content, nickname: document.getElementById('inputNick').value.trim() || '匿名' })
          });
          const d = await r.json();
          if (!r.ok) { toast(d.error || '润色失败'); }
          else if (d.polished) { input.value = d.polished; updateCharCounter(); toast('润色完成'); }
        } catch(e) { toast('润色失败'); }
        finally { btn.disabled = false; btn.textContent = '润色'; }
      });
    }

    /* ===== Char counter ===== */
    function initCharCounter() {
      const input = document.getElementById('inputContent');
      input.addEventListener('input', updateCharCounter);
      updateCharCounter();
    }
    function updateCharCounter() {
      const input = document.getElementById('inputContent');
      const counter = document.getElementById('charCounter');
      const len = input.value.length;
      counter.textContent = len + '/' + maxContentLength;
      counter.classList.toggle('over', len > maxContentLength);
    }

    /* ===== Utils ===== */
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    /* ===== Days counter ===== */
    function initDaysCounter() {
      const badge = document.getElementById('daysBadge');
      if (!badge) return;
      const dateStr = badge.dataset.date;
      const nameA = badge.dataset.nameA || '';
      const nameB = badge.dataset.nameB || '';
      if (!dateStr) return;
      const start = new Date(dateStr);
      if (isNaN(start.getTime())) return;
      const days = Math.floor((Date.now() - start.getTime()) / 86400000);
      function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
      let text = '';
      if (nameA && nameB) {
        text = esc(nameA) + ' &amp; ' + esc(nameB) + ' 在一起 <span class="num">' + days + '</span> 天';
      } else {
        text = '在一起 <span class="num">' + days + '</span> 天';
      }
      document.getElementById('daysContent').innerHTML = text;
      badge.style.display = 'block';
    }
    /*]]>*/
  </script>
</body>
